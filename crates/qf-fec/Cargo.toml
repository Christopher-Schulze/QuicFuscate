[package]
name = "qf-fec"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[features]
default = []
benches = []
rust-tests = [
    "qf-common/rust-tests",
    "qf-cpu/rust-tests",
    "qf-memory-pool/rust-tests",
    "qf-simd/rust-tests",
]

[dependencies]
aligned_box = "0.2"
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
parking_lot = "0.12"
qf-common = { path = "../qf-common" }
qf-crypto = { path = "../qf-crypto" }
qf-cpu = { path = "../qf-cpu" }
qf-memory-pool = { path = "../qf-memory-pool" }
qf-simd = { path = "../qf-simd" }
qf-telemetry = { path = "../qf-telemetry" }
rayon = "1.7"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
