# TODO-1052 persona wire trace fixture.
#
# One versioned source for the (direction, gap, length) send sequence the
# PersonaTrace wire budget replays. `dir` is the datagram direction seen on
# the wire (`c` = client -> server, `s` = server -> client), `gap_ms` is the
# milliseconds since the previous datagram in either direction, and `len` is
# the UDP payload length in bytes.
#
# Provenance:
#   chromium.sequence — verified wire capture of Chrome 154.0.8037.44
#     (2026-09-22): real bidirectional HTTP/3 exchange against aioquic
#     1.3.0 on 127.0.0.1, bridged through a pcap relay
#     (scripts/capture/quic_initial_listener.py-style). The capture holds
#     290 datagrams; the first 40 below cover the classifier window
#     (handshake + request + the start of the ACK-clocked bulk phase).
#   chromium.quiet — the same capture shows the client going silent for
#     ~5.2 s after the transfer completes, then sending one 59-byte
#     CONNECTION_CLOSE. Browsers send no periodic PING; a stealth
#     connection that emits interval keepalives is itself the fingerprint.
#     Chrome's negotiated max_idle_timeout is 30 s, so quiet stretches to
#     the idle horizon.
#
# The quiet phase is real: browsers send nothing while idle.

snapshot = "2026-09-22"

[chromium]
provenance = "wire-capture"
captured_at = "2026-09-22"

# Verified first-40-datagram sequence (covers the ~30-packet classifier
# window): three padded Initials with retransmit, server Initial flight,
# client Handshake Finished, the 525-byte h3 request, then the ACK-clocked
# bulk download where the client emits 39-42-byte ACKs.
[[chromium.sequence]]
dir = "c"
gap_ms = 0
len = 1258
