# Client length classes used when the budget has bytes to spend and real
# traffic exists to shape. These classes are the observed client sizes in
# the capture; padding never invents sizes outside this set.
[chromium.length_classes]
ack = 40
request = 525
initial = 1258

# Quiet phase: no sends at all. The capture shows ~5.2 s of silence after
# the last data ACK before the client CONNECTION_CLOSE; with the negotiated
# 30 s idle timeout the quiet floor extends to 10 s before the connection
# may legitimately be considered closing down.
[chromium.quiet]
quiet_ms = 10000

[firefox]
provenance = "source-constants"
captured_at = "2026-09-22"
