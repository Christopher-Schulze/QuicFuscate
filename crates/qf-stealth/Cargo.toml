[package]
name = "qf-stealth"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[features]
default = []
rust-tests = ["qf-common/rust-tests", "qf-compress/rust-tests", "qf-crypto/rust-tests"]

[dependencies]
qf-common = { path = "../qf-common" }
qf-compress = { path = "../qf-compress" }
qf-cpu = { path = "../qf-cpu" }
qf-crypto = { path = "../qf-crypto" }
qf-transport-types = { path = "../qf-transport-types" }
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
zeroize = "1.8"

[dev-dependencies]
serde_json = "1.0"
