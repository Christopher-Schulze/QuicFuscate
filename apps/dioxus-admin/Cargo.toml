[package]
name = "quicfuscate-dioxus-admin"
version = "0.4.3"
edition = "2021"
authors = ["QuicFuscate Team"]
license = "MIT"

[dependencies]
dioxus = { version = "0.7", features = ["web"] }
quicfuscate-dioxus-ui = { path = "../../packages/dioxus-ui" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Storage", "Window", "console"] }
chrono = "0.4"

[workspace]
