[package]
name = "quicfuscate-dioxus-desktop"
version = "0.4.3"
edition = "2021"
authors = ["QuicFuscate Team"]
license = "MIT"

[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
dioxus-desktop = "0.7"
quicfuscate-dioxus-ui = { path = "../../packages/dioxus-ui" }
quicfuscate = { path = "../../" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
dirs = "5"
log = "0.4"

[workspace]

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
