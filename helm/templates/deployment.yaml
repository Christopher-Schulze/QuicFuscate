{{- /*
QuicFuscate Helm - Deployment

Deploys the server with TUN device access, init container (modprobe tun),
liveness/readiness probes on the admin HTTP port, and a PVC for QKey state.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quicfuscate.fullname" . }}
  labels:
    {{- include "quicfuscate.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "quicfuscate.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "quicfuscate.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "quicfuscate.fullname" .) }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: load-tun-module
          image: {{ .Values.initContainer.image }}
          command:
            {{- toYaml .Values.initContainer.command | nindent 12 }}
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: tun-device
              mountPath: /dev/net/tun
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
      containers:
        - name: quicfuscate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - server
            - --listen
            - "0.0.0.0:{{ .Values.service.port }}"
            - --cert
            - {{ .Values.certs.mountPath }}/tls.crt
            - --key
            - {{ .Values.certs.mountPath }}/tls.key
            - --config
            - {{ .Values.config.mountPath }}
            {{- if .Values.tun.enabled }}
            - --tun
            - --tun-name
            - {{ .Values.tun.name | quote }}
            {{- end }}
            - --admin-web
            - {{ .Values.admin.bind | quote }}
            - --admin-web-root
            - {{ .Values.admin.webRoot | quote }}
            - --admin-web-user
            - $(QUICFUSCATE_ADMIN_USER)
            - --admin-web-password
            - $(QUICFUSCATE_ADMIN_PASSWORD)
          env:
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: {{ include "quicfuscate.fullname" . }}-config
                  key: rust_log
                  optional: true
            - name: QUICFUSCATE_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "quicfuscate.fullname" . }}-secret
                  key: admin_user
            - name: QUICFUSCATE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "quicfuscate.fullname" . }}-secret
                  key: admin_password
            {{- if .Values.qkey.encryptionKey }}
            - name: QUICFUSCATE_QKEY_ENC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "quicfuscate.fullname" . }}-secret
                  key: qkey_enc_key
            {{- end }}
          ports:
            - name: quic
              containerPort: {{ .Values.service.port }}
              protocol: UDP
            - name: admin
              containerPort: 8080
              protocol: TCP
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: {{ .Values.config.mountPath }}
              subPath: quicfuscate.toml
              readOnly: true
            - name: certs
              mountPath: {{ .Values.certs.mountPath }}
              readOnly: true
            - name: tun-device
              mountPath: /dev/net/tun
            - name: state
              mountPath: /var/lib/quicfuscate
            - name: logs
              mountPath: /var/log/quicfuscate
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "kill -TERM 1"]
      terminationGracePeriodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: {{ include "quicfuscate.fullname" . }}-config
            items:
              - key: quicfuscate.toml
                path: quicfuscate.toml
        - name: certs
          secret:
            secretName: {{ .Values.certs.existingSecret | default (printf "%s-tls" (include "quicfuscate.fullname" .)) }}
        - name: tun-device
          hostPath:
            path: {{ .Values.tunDevice.hostPath }}
            type: {{ .Values.tunDevice.type }}
        - name: lib-modules
          hostPath:
            path: {{ .Values.libModules.hostPath }}
            type: {{ .Values.libModules.type }}
        {{- if .Values.persistence.enabled }}
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "quicfuscate.fullname" . }}-state
        {{- else }}
        - name: state
          emptyDir: {}
        {{- end }}
        - name: logs
          emptyDir: {}
---
{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "quicfuscate.fullname" . }}-state
  labels:
    {{- include "quicfuscate.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName | quote }}
  {{- end }}
{{- end }}
