{{- /*
QuicFuscate Helm - Service

Exposes the QUIC server (UDP 443) via LoadBalancer and the admin HTTP
dashboard (TCP 8080) via ClusterIP (internal only).
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quicfuscate.fullname" . }}
  labels:
    {{- include "quicfuscate.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "quicfuscate.selectorLabels" . | nindent 4 }}
  ports:
    - name: quic
      port: {{ .Values.service.port }}
      targetPort: quic
      protocol: UDP
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
---
{{- if .Values.adminService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quicfuscate.fullname" . }}-admin
  labels:
    {{- include "quicfuscate.labels" . | nindent 4 }}
  {{- with .Values.adminService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.adminService.type }}
  selector:
    {{- include "quicfuscate.selectorLabels" . | nindent 4 }}
  ports:
    - name: admin
      port: {{ .Values.adminService.port }}
      targetPort: admin
      protocol: TCP
{{- end }}
