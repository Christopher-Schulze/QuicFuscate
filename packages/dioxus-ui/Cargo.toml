[package]
name = "quicfuscate-dioxus-ui"
version = "0.4.3"
edition = "2021"
authors = ["QuicFuscate Team"]
license = "MIT"

[dependencies]
dioxus = { version = "0.7", default-features = true }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
regex = "1"
unicode-normalization = "0.1"
tokio = { version = "1", features = ["time"] }

[workspace]
