# ==============================================================================
# QuicFuscate Server Configuration - Linux Default Template
# ==============================================================================
#
# This is a comprehensive server configuration template for Linux deployments.
# All values shown are the defaults. Uncomment and modify as needed.
# See also: config/quicfuscate.toml for the full canonical reference.

# ==============================================================================
# ENGINE
# ==============================================================================

[engine]
mode = "server"
# log_level = "info"           # Options: "error", "warn", "info", "debug", "trace"
# auto_start = false
# shutdown_timeout_ms = 5000   # Graceful shutdown timeout in milliseconds

# ==============================================================================
# CONNECTION (server listen and TLS)
# ==============================================================================

[connection]
remote = "0.0.0.0:4433"        # Server listen address
# verify_peer = true
# cert_file = ""               # Path to TLS certificate (required for server)
# key_file = ""                # Path to TLS private key (required for server)
# alpn = ["h3", "quicfuscate"]
# idle_timeout_ms = 30000      # Connection idle timeout (0 = no timeout)
# enable_0rtt = true           # WARNING: 0-RTT data can be replayed
# max_streams_bidi = 100
# max_streams_uni = 100
# enable_migration = true   # candidate paths must validate before activation
# migration_cwnd_reduction_factor = 0.5  # port-only retained cwnd; 0 reset, 1 retain
# migration_cooldown_ms = 750             # 0 disables the cooldown
# migration_probe_target = "previous-window" # previous-window | reduced-window

# ==============================================================================
# NAT TRAVERSAL / PATH DISCOVERY
# ==============================================================================

[nat_traversal]
# Optional STUN/TURN/ICE path discovery. Disabled by default because STUN/ICE
# probes are observable and are only useful when direct UDP, roaming, or mesh
# connectivity needs them.
enabled = false
# mode = "off"                  # off | connectivity-fallback | roaming | mesh | always
# stun_servers = []             # e.g. ["203.0.113.10:3478"]
# turn_servers = []             # reserved for relayed candidates
# ice_enabled = false
# probe_interval_ms = 30000
# max_candidates = 8

# ==============================================================================
# 0-RTT ANTI-REPLAY PROTECTION
# ==============================================================================

[anti_replay]
# Enable anti-replay protection for 0-RTT early data (server mode only).
# Required when connection.enable_0rtt = true to prevent replay attacks
# (RFC 8446 Section 8, RFC 9001 Section 9.2).
enabled = true
# max_ticket_age_secs = 10     # Reject 0-RTT tickets older than this
# max_entries = 100000         # Strike register capacity (~5 MB at 100k entries)
# max_early_data_size = 16384  # Max 0-RTT bytes per connection (16 KB)

# ==============================================================================
# CRYPTO
# ==============================================================================

# [crypto]
# aead_preference = "auto"     # Options: "auto", "aegis-128l", "morus"
# force_aead = ""              # Override AEAD selection

# ==============================================================================
# STEALTH
# ==============================================================================

[stealth]
mode = "performance"
# Options: "off", "performance", "stealth", "anti-dpi", "intelligent", "manual"
# - off:          no stealth features
# - performance:  minimal fingerprinting, costly features off (alias: "base")
# - stealth:      balanced features with minimal overhead
# - anti-dpi:     ultra stealth with aggressive settings (alias: "max")
# - intelligent:  adaptive mode, escalates on probe detection (alias: "auto")
# - manual:       custom (use settings below)

# Manual mode settings (only used when mode = "manual"):
# enable_domain_fronting = true
# enable_http3_masquerading = true
# use_tls_cover = true
# use_qpack_headers = true
# enable_traffic_padding = false
# enable_timing_obfuscation = false
# enable_protocol_mimicry = true
# enable_doh = true
# doh_provider = "https://cloudflare-dns.com/dns-query"
# padding_strategy = "adaptive"    # Options: "random", "fixed", "adaptive", "browser_mimic"
# max_padding_size = 256           # bytes
# fronting_domains = []
# initial_browser = "chrome"       # chrome, firefox, safari, edge
# initial_os = "linux"             # windows, macos, linux, android, ios
# enable_network_fingerprint_normalization = true
# suppress_icmp_unreachable = false # preserves PMTUD signals even when true

# ==============================================================================
# FINGERPRINT ROTATION
# ==============================================================================

# [fingerprint_rotation]
# enabled = false
# interval_secs = 300          # Rotation interval (0 = disabled)
# mode = "fixed"               # Options: "fixed", "slots", "all"
# profile_slots = ["chrome:linux", "firefox:linux"]

# ==============================================================================
# FEC (Forward Error Correction)
# ==============================================================================

# [fec]
# mode = "auto"                # Options: "auto", "off"
# window_excellent = 0         # No FEC when network is excellent
# window_good = 10
# window_fair = 30
# window_poor = 50
# enable_partial = true
# enable_pid = true
# enable_hysteresis = true
# enable_kalman = true
# stream_every = 5             # Streaming emission period (packets)

# ==============================================================================
# TRANSPORT
# ==============================================================================

# [transport]
# cc_algorithm = "bbr3"        # Options: "reno", "bbr2", "bbr3"
# mtu = 1400
# max_udp_payload = 1350
# max_idle_timeout = 30000
# initial_rtt_ms = 100
# enable_pacing = true
# initial_max_data = 10000000
# initial_max_stream_data_bidi_local = 1000000
# initial_max_stream_data_bidi_remote = 1000000
# initial_max_stream_data_uni = 1000000
# initial_max_streams_bidi = 100
# initial_max_streams_uni = 100
# enable_early_data = false
# dgram_recv_queue_len = 1024
# dgram_send_queue_len = 1024
# disable_pmtud = false

# ==============================================================================
# PERFORMANCE OPTIMIZATION
# ==============================================================================

# [optimization]
# memory_pool_size = 67108864  # 64MB
# memory_pool_alignment = 64   # Cache line alignment
# num_worker_threads = 0       # 0 = auto-detect

# ==============================================================================
# INTERFACE
# ==============================================================================

# [interface]
# type = "tun"                 # Options: "tun", "tap", "xdp", "raw_socket"
# tun_name = "quicfuse0"
# tun_mtu = 1500
# enable_gso = true
# enable_gro = true
# xdp_mode = "disabled"        # disabled | native | generic
# xdp_flags = 0

# ==============================================================================
# TELEMETRY AND LOGGING
# ==============================================================================

# [telemetry]
# enabled = true
# export_interval = 60
# collect_packet_stats = true
# collect_stream_stats = true
# collect_congestion_stats = true
# collect_fec_stats = true
# collect_stealth_stats = true

[logging]
level = "info"
# log_to_file = false
# log_file_path = "/var/log/quicfuscate/server.log"
# log_to_stdout = true
# format = "json"
# max_file_size_bytes = 104857600
# max_files = 5
# syslog_addr = "127.0.0.1:514"
# module_levels = { "quicfuscate::transport" = "debug" }

[audit]
queue_capacity = 16384
max_segment_bytes = 67108864
max_segments = 8
flush_timeout_ms = 5000

# ==============================================================================
# REALITY-GRADE TLS MIMIKRY (TODO-415 Phase 1)
# ==============================================================================
# When enabled, the server caches TLS handshake material from a cover site
# and replays it to clients/probes, making the proxy indistinguishable from
# the real cover site at the TLS layer (similar to XTLS-Reality).
#
# Env overrides:
#   QUICFUSCATE_REALITY_ENABLED=true/false
#   QUICFUSCATE_REALITY_COVER_HOST=www.cloudflare.com
#   QUICFUSCATE_REALITY_COVER_PORT=443
#   QUICFUSCATE_REALITY_CACHE_TTL=3600
#   QUICFUSCATE_REALITY_FALLBACK_SYNTHETIC=true

# [reality]
# enabled = false
# cover_host = "www.cloudflare.com"
# cover_port = 443
# cache_ttl = 3600
# fallback_to_synthetic = true

# ==============================================================================
# DDoS PROTECTION: SUSTAINED ADMISSION, GEOIP, AND BLACKLIST
# ==============================================================================
# Sustained enhanced admission uses interval-correct accepted PPS, monotonic
# activation/clear windows, higher per-IP token cost for new traffic, and
# stateless RFC-compliant QUIC Retry. Invalid values fail server startup.
#
#   QUICFUSCATE_DDOS_ENABLED=true
#   QUICFUSCATE_DDOS_SAMPLE_INTERVAL_MS=1000
#   QUICFUSCATE_DDOS_ACTIVATION_WINDOW_MS=5000
#   QUICFUSCATE_DDOS_CLEAR_WINDOW_MS=15000
#   QUICFUSCATE_DDOS_EWMA_ALPHA=0.1
#   QUICFUSCATE_DDOS_SPIKE_MULTIPLIER=3.0
#   QUICFUSCATE_DDOS_CLEAR_FACTOR=1.5
#   QUICFUSCATE_DDOS_ENHANCED_PACKET_COST=2
#   QUICFUSCATE_DDOS_RETRY_ENABLED=true
#   QUICFUSCATE_DDOS_RETRY_TOKEN_LIFETIME_SECS=10
#
# GeoIP blocking (requires a MaxMindDB GeoLite2-Country database):
#   QUICFUSCATE_GEOIP_DB_PATH=/path/to/GeoLite2-Country.mmdb
#   QUICFUSCATE_GEOIP_BLOCKED_COUNTRIES=CN,RU,KP    # comma-separated ISO codes
#
# External blacklist sync is strict HTTPS and atomically persists bounded
# last-known-good state. Set the cache path to "disabled" to disable persistence.
#
#   QUICFUSCATE_BLACKLIST_SYNC_URL=https://example.com/blocklist.txt
#   QUICFUSCATE_BLACKLIST_CA_PATH=/path/to/private-feed-ca-bundle.pem
#   QUICFUSCATE_BLACKLIST_TTL_SECS=3600             # TTL per blocked IP
#   QUICFUSCATE_BLACKLIST_SYNC_INTERVAL_SECS=3600   # re-fetch interval
#   QUICFUSCATE_BLACKLIST_REQUEST_TIMEOUT_SECS=30
#   QUICFUSCATE_BLACKLIST_MAX_BODY_BYTES=16777216
#   QUICFUSCATE_BLACKLIST_MAX_ENTRIES=250000
#   QUICFUSCATE_BLACKLIST_CACHE_PATH=config/local/blacklist-cache.json

# ==============================================================================
# QKEY AUTHENTICATION ABUSE POLICY
# ==============================================================================
# The defaults apply exponential per-IP backoff after three consecutive terminal
# QKey failures, block after ten failures, and bound attacker-controlled state.
# Invalid values fail server configuration instead of silently weakening policy.
#
#   QUICFUSCATE_AUTH_POLICY_ENABLED=true
#   QUICFUSCATE_AUTH_BACKOFF_AFTER_FAILURES=3
#   QUICFUSCATE_AUTH_BACKOFF_BASE_MS=250
#   QUICFUSCATE_AUTH_BACKOFF_MAX_MS=8000
#   QUICFUSCATE_AUTH_BLOCK_AFTER_FAILURES=10
#   QUICFUSCATE_AUTH_BLOCK_DURATION_SECS=300
#   QUICFUSCATE_AUTH_IDLE_TIMEOUT_SECS=900
#   QUICFUSCATE_AUTH_PRUNE_INTERVAL_SECS=30
#   QUICFUSCATE_AUTH_MAX_TRACKED_IPS=65536
#   QUICFUSCATE_AUTH_MAX_PENDING_PER_IP=4

# ==============================================================================
# PER-SESSION BANDWIDTH, QUOTA, AND FAIR SCHEDULING
# ==============================================================================
# Defaults are unlimited with equal weight. Rate and burst must both be zero or
# both nonzero. Quotas combine uplink and downlink usage and reset at UTC day or
# calendar-month boundaries. Invalid values fail server configuration.
#
#   QUICFUSCATE_CLIENT_RATE_BYTES_PER_SECOND=0
#   QUICFUSCATE_CLIENT_BURST_BYTES=0
#   QUICFUSCATE_CLIENT_DAILY_QUOTA_BYTES=0
#   QUICFUSCATE_CLIENT_MONTHLY_QUOTA_BYTES=0
#   QUICFUSCATE_CLIENT_BANDWIDTH_WEIGHT=1
#
# Optional shared downlink shaper for proportional DRR service under aggregate
# contention. Rate and burst must both be zero or both nonzero.
#
#   QUICFUSCATE_SERVER_DOWNLINK_RATE_BYTES_PER_SECOND=0
#   QUICFUSCATE_SERVER_DOWNLINK_BURST_BYTES=0
