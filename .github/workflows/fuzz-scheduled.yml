name: Fuzz Extended

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

concurrency:
  group: fuzz-extended-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz-targets:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      ASAN_OPTIONS: "detect_odr_violation=0"
      FUZZ_DURATION: "1800"
      FUZZ_JOBS: "4"
    steps:
      - uses: actions/checkout@v7

      - name: Set up nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --version "0.13.2" --locked

      - name: Verify fuzz contract
        run: bash scripts/audits/verify-fuzz-contract.sh

      - name: Run extended fuzz targets with AddressSanitizer
        run: RUSTFLAGS="-Zsanitizer=address" bash scripts/tests/fuzz/run-ci-fuzz.sh

      - name: Upload crash artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-extended-crashes
          path: scripts/tests/fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30
