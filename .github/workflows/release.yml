name: Release Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  linux-server-bundle:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-linux-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release

      - name: Build admin web assets
        run: |
          bun install
          bash scripts/build/build-web-admin.sh

      - name: Create server bundle
        run: |
          bash scripts/build/build-server-bundle.sh \
            --binary ./target/release/quicfuscate \
            --assets ./assets/web-admin

      - name: Upload server bundle
        uses: actions/upload-artifact@v4
        with:
          name: quicfuscate-server-linux
          path: scripts/out/build/
          if-no-files-found: error

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: quicfuscate-linux-binary
          path: target/release/quicfuscate

      - name: Generate checksums and signatures
        # The checksum file must NOT be hashed itself. Writing it in-place
        # via `sha256sum * > checksums-sha256.txt` would create the (empty)
        # file before glob expansion, so `*` would include it and produce a
        # self-referential entry that fails `sha256sum -c` verification.
        # We therefore write to a temp file and move it into place after.
        # Also, build-server-bundle.sh leaves a staging directory alongside
        # the tarball; sha256sum cannot hash directories, so we only hash
        # files (*.tar.gz, not the unpacked staging dir).
        run: |
          cd scripts/out/build/
          # SHA-256 checksums for all bundle artifacts (files only, excluding
          # the checksum file itself, which doesn't exist yet during globbing,
          # and excluding staging directories left by build-server-bundle.sh).
          tmp=$(mktemp)
          find . -maxdepth 1 -type f ! -name 'checksums-sha256.txt' -exec sha256sum {} + > "$tmp"
          mv "$tmp" checksums-sha256.txt
          # GPG signature if signing key is configured (optional)
          if [ -n "${{ secrets.RELEASE_GPG_KEY_ID }}" ]; then
            echo "GPG signing key configured — signing checksums"
            echo "${{ secrets.RELEASE_GPG_PRIVATE_KEY }}" | gpg --import
            gpg --detach-sign --local-user "${{ secrets.RELEASE_GPG_KEY_ID }}" \
              --output checksums-sha256.txt.sig checksums-sha256.txt
          else
            echo "No GPG signing key configured — checksums only (no signature)"
          fi

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: quicfuscate-checksums
          path: |
            scripts/out/build/checksums-sha256.txt
            scripts/out/build/checksums-sha256.txt.sig
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Desktop builds (Tauri) — macOS, Windows, Linux
  # ---------------------------------------------------------------------------
  # These jobs build the Tauri desktop app bundles (DMG/MSI/AppImage/deb)
  # with updater signing. The frontend (svelte-desktop) is built as part of
  # the Tauri build process via beforeBuildCommand. No UI changes are made;
  # these jobs only package the existing frontend into native bundles.
  # ---------------------------------------------------------------------------
  desktop-macos:
    runs-on: macos-latest
    continue-on-error: true
    env:
      CARGO_INCREMENTAL: "0"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0.0"
      - name: Install dependencies
        run: |
          cd apps/svelte-desktop && bun install
          cd ../../ && bun install
      - name: Build Tauri desktop app (macOS)
        working-directory: apps/tauri/src-tauri
        run: cargo tauri build --target aarch64-apple-darwin
      - name: Upload macOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: quicfuscate-desktop-macos
          path: |
            apps/tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.dmg
            apps/tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.app
          if-no-files-found: warn

  desktop-windows:
    runs-on: windows-latest
    continue-on-error: true
    env:
      CARGO_INCREMENTAL: "0"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0.0"
      - name: Install dependencies
        run: |
          cd apps/svelte-desktop; bun install
          cd ../..; bun install
      - name: Build Tauri desktop app (Windows)
        working-directory: apps/tauri/src-tauri
        run: cargo tauri build
      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: quicfuscate-desktop-windows
          path: |
            apps/tauri/src-tauri/target/release/bundle/**/*.msi
            apps/tauri/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: warn

  desktop-linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CARGO_INCREMENTAL: "0"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0.0"
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            libappindicator3-dev 2>/dev/null || true
      - name: Install dependencies
        run: |
          cd apps/svelte-desktop && bun install
          cd ../../ && bun install
      - name: Build Tauri desktop app (Linux)
        working-directory: apps/tauri/src-tauri
        run: cargo tauri build
      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: quicfuscate-desktop-linux
          path: |
            apps/tauri/src-tauri/target/release/bundle/**/*.deb
            apps/tauri/src-tauri/target/release/bundle/**/*.AppImage
            apps/tauri/src-tauri/target/release/bundle/**/*.rpm
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Release publishing — creates a GitHub Release with all artifacts
  # ---------------------------------------------------------------------------
  publish-release:
    needs: [linux-server-bundle]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Display structure
        run: find release-artifacts -type f | head -30
      - name: Generate latest.json for Tauri updater
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          # Find the macOS DMG for the updater manifest
          MACOS_DMG=$(find release-artifacts -name "*.dmg" | head -1)
          # Generate the Tauri updater manifest
          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "QuicFuscate ${TAG}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "",
                "url": "https://github.com/Christopher-Schulze/QuicFuscate/releases/download/${TAG}/$(basename "$MACOS_DMG" 2>/dev/null || echo "quicfuscate-desktop-macos.dmg")"
              }
            }
          }
          EOF
          echo "Generated latest.json:"
          cat latest.json
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Upload latest.json alongside other artifacts
          cp latest.json release-artifacts/
          gh release create "$TAG" \
            --title "QuicFuscate $TAG" \
            --generate-notes \
            release-artifacts/**/*
