name: Release Build

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  release-version-contract:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Verify release version contract
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            bash scripts/audits/verify-release-version.sh --tag "$GITHUB_REF_NAME"
          else
            bash scripts/audits/verify-release-version.sh
          fi

      - name: Dependency reproducibility audit
        shell: bash
        run: bash scripts/audits/verify-reproducible-dependencies.sh

      - name: Verify generated web-admin publish contract
        shell: bash
        run: bash scripts/audits/verify-web-admin-publish-contract.sh

      - name: Verify TLS ClientHello ownership contract
        shell: bash
        run: bash scripts/audits/verify-tls-clienthello-contract.sh

      - name: Verify locked frontend dependency security
        shell: bash
        run: bash scripts/audits/verify-frontend-dependencies.sh

      - name: Install dependency audit tools
        shell: bash
        run: |
          cargo install cargo-audit --version "0.22.2" --locked
          cargo install cargo-deny --version "0.19.0" --locked

      - name: Verify locked Tauri dependency security
        shell: bash
        run: bash scripts/audits/verify-tauri-dependencies.sh

  linux-server-bundle:
    needs: release-version-contract
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-linux-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build admin web assets
        run: |
          bun install --frozen-lockfile
          bash scripts/build/build-web-admin.sh

      - name: Create server bundle
        run: |
          bash scripts/build/build-server-bundle.sh \
            --binary ./target/release/quicfuscate \
            --assets ./assets/web-admin

      - name: Upload server bundle
        uses: actions/upload-artifact@v7
        with:
          name: quicfuscate-server-linux
          path: |
            scripts/out/build/*.tar.gz
          if-no-files-found: error

      - name: Upload release binary
        uses: actions/upload-artifact@v7
        with:
          name: quicfuscate-linux-binary
          path: target/release/quicfuscate

      - name: Generate checksums and signatures
        # The checksum file must NOT be hashed itself. Writing it in-place
        # via `sha256sum * > checksums-sha256.txt` would create the (empty)
        # file before glob expansion, so `*` would include it and produce a
        # self-referential entry that fails `sha256sum -c` verification.
        # We therefore write to a temp file and move it into place after.
        # Also, build-server-bundle.sh leaves a staging directory alongside
        # the tarball; sha256sum cannot hash directories, so we only hash
        # files (*.tar.gz, not the unpacked staging dir).
        run: |
          cd scripts/out/build/
          # SHA-256 checksums for all bundle artifacts (files only, excluding
          # the checksum file itself, which doesn't exist yet during globbing,
          # and excluding staging directories left by build-server-bundle.sh).
          tmp=$(mktemp)
          find . -maxdepth 1 -type f ! -name 'checksums-sha256.txt' -exec sha256sum {} + > "$tmp"
          mv "$tmp" checksums-sha256.txt
          # GPG signature if signing key is configured (optional)
          if [ -n "${{ secrets.RELEASE_GPG_KEY_ID }}" ]; then
            echo "GPG signing key configured - signing checksums"
            echo "${{ secrets.RELEASE_GPG_PRIVATE_KEY }}" | gpg --import
            gpg --detach-sign --local-user "${{ secrets.RELEASE_GPG_KEY_ID }}" \
              --output checksums-sha256.txt.sig checksums-sha256.txt
          else
            echo "No GPG signing key configured - checksums only (no signature)"
          fi

      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: quicfuscate-checksums
          path: |
            scripts/out/build/checksums-sha256.txt
            scripts/out/build/checksums-sha256.txt.sig
          if-no-files-found: warn

  linux-server-bundle-arm64:
    needs: release-version-contract
    runs-on: ubuntu-24.04-arm
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-linux-arm64-${{ hashFiles('**/Cargo.lock') }}

      - name: Build native ARM64 release binary
        run: cargo build --release --locked

      - name: Build admin web assets
        run: |
          bun install --frozen-lockfile
          bash scripts/build/build-web-admin.sh

      - name: Create native ARM64 server bundle
        run: |
          bash scripts/build/build-server-bundle.sh \
            --binary ./target/release/quicfuscate \
            --assets ./assets/web-admin \
            --name quicfuscate-server-bundle-linux-arm64
          bundle=$(find scripts/out/build -maxdepth 1 -type f \
            -name 'quicfuscate-server-bundle-linux-arm64-*.tar.gz' -print -quit)
          test -n "$bundle"
          bundle_dir=$(dirname "$bundle")
          bundle_name=$(basename "$bundle")
          (
            cd "$bundle_dir"
            sha256sum "$bundle_name" > "${bundle_name}.sha256"
          )

      - name: Upload native ARM64 server bundle
        uses: actions/upload-artifact@v7
        with:
          name: quicfuscate-server-linux-arm64
          path: |
            scripts/out/build/quicfuscate-server-bundle-linux-arm64-*.tar.gz
            scripts/out/build/quicfuscate-server-bundle-linux-arm64-*.tar.gz.sha256
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Desktop builds (Tauri) - macOS, Linux, and Windows
  # ---------------------------------------------------------------------------
  # These jobs build the Tauri desktop app bundles with updater signing.
  # The frontend (svelte-desktop) is built as part of the Tauri build process
  # via beforeBuildCommand. No UI changes are made; these jobs only package
  # the existing frontend into native bundles.
  #
  # Every desktop updater platform is required for a tagged publication. The
  # shared manifest contract owns the platform list and rejects any missing,
  # empty, or mismatched bundle/signature pair before GitHub Release creation.
  #
  # ---------------------------------------------------------------------------
  desktop-macos:
    needs: release-version-contract
    runs-on: macos-latest
    env:
      CARGO_INCREMENTAL: "0"
      QUICFUSCATE_DESKTOP_UPDATER_ACTIVE: "true"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: clippy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "2.11.4" --locked
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build desktop frontend for locked Tauri gate
        working-directory: apps/svelte-desktop
        run: bun run build
      - name: Verify locked Tauri host
        working-directory: apps/tauri/src-tauri
        run: |
          cargo metadata --locked --no-deps --format-version 1
          cargo check --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build Tauri desktop app (macOS)
        working-directory: apps/tauri/src-tauri
        run: cargo tauri build --target aarch64-apple-darwin -- --locked
      - name: Verify signed macOS updater artifacts
        shell: bash
        run: |
          bundle_count=$(find target/aarch64-apple-darwin/release/bundle -type f -name '*.app.tar.gz' | wc -l | tr -d ' ')
          signature_count=$(find target/aarch64-apple-darwin/release/bundle -type f -name '*.app.tar.gz.sig' | wc -l | tr -d ' ')
          test "$bundle_count" -eq 1 || { echo "expected one macOS updater bundle, found $bundle_count" >&2; exit 1; }
          test "$signature_count" -eq 1 || { echo "expected one macOS updater signature, found $signature_count" >&2; exit 1; }
      - name: Upload macOS bundle
        uses: actions/upload-artifact@v7
        with:
          name: quicfuscate-desktop-macos
          # NOTE: .cargo/config.toml sets target-dir = "target" at the repo
          # root, so the Tauri build output lands in <repo-root>/target/...
          # even though `cargo tauri build` is invoked with
          # working-directory: apps/tauri/src-tauri. Do NOT use
          # apps/tauri/src-tauri/target/ here - that directory never exists.
          path: |
            target/aarch64-apple-darwin/release/bundle/**/*.dmg
            target/aarch64-apple-darwin/release/bundle/**/*.app.tar.gz
            target/aarch64-apple-darwin/release/bundle/**/*.app.tar.gz.sig
          if-no-files-found: error

  desktop-linux:
    needs: release-version-contract
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      QUICFUSCATE_DESKTOP_UPDATER_ACTIVE: "true"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: clippy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "2.11.4" --locked
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            libglib2.0-dev
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build desktop frontend for locked Tauri gate
        working-directory: apps/svelte-desktop
        run: bun run build
      - name: Verify locked Tauri host
        working-directory: apps/tauri/src-tauri
        run: |
          cargo metadata --locked --no-deps --format-version 1
          cargo check --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build Tauri desktop app (Linux)
        working-directory: apps/tauri/src-tauri
        run: cargo tauri build -- --locked
      - name: Verify signed Linux updater artifacts
        shell: bash
        run: |
          bundle_count=$(find target/release/bundle -type f -name '*.AppImage' | wc -l | tr -d ' ')
          signature_count=$(find target/release/bundle -type f -name '*.AppImage.sig' | wc -l | tr -d ' ')
          test "$bundle_count" -eq 1 || { echo "expected one Linux updater bundle, found $bundle_count" >&2; exit 1; }
          test "$signature_count" -eq 1 || { echo "expected one Linux updater signature, found $signature_count" >&2; exit 1; }
      - name: Upload Linux bundle
        uses: actions/upload-artifact@v7
        with:
          name: quicfuscate-desktop-linux
          # NOTE: .cargo/config.toml sets target-dir = "target" at the repo
          # root, so the Tauri build output lands in <repo-root>/target/...
          # even though `cargo tauri build` is invoked with
          # working-directory: apps/tauri/src-tauri. Do NOT use
          # apps/tauri/src-tauri/target/ here - that directory never exists.
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.deb.sig
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.AppImage.sig
          if-no-files-found: error

  desktop-windows:
    needs: release-version-contract
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      QUICFUSCATE_DESKTOP_UPDATER_ACTIVE: "true"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: clippy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "2.11.4" --locked
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Build desktop frontend for locked Tauri gate
        working-directory: apps/svelte-desktop
        run: bun run build
      - name: Provision verified upstream Wintun for MSI
        shell: pwsh
        run: |
          ./scripts/utils/provision-wintun.ps1 `
            -DestinationDirectory "apps/tauri/src-tauri/resources/windows" `
            -EvidencePath "scripts/out/build/windows/wintun-provenance.json"
      - name: Verify locked Tauri host
        working-directory: apps/tauri/src-tauri
        run: |
          cargo metadata --locked --no-deps --format-version 1
          cargo check --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build signed Tauri MSI (Windows)
        working-directory: apps/tauri/src-tauri
        run: cargo tauri build --bundles msi --ci -- --locked
      - name: Verify signed MSI updater artifacts
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path "target/release/bundle" -Recurse -File -Filter "*.msi")
          if ($installers.Count -eq 0) {
            throw "Tauri produced no Windows MSI installer"
          }
          foreach ($installer in $installers) {
            $signature = "$($installer.FullName).sig"
            if (-not (Test-Path -LiteralPath $signature -PathType Leaf)) {
              throw "Missing updater signature for $($installer.Name)"
            }
          }
          foreach ($installer in $installers) {
            $extraction = Join-Path $env:RUNNER_TEMP `
              "quicfuscate-msi-$([System.IO.Path]::GetFileNameWithoutExtension($installer.Name))"
            New-Item -ItemType Directory -Path $extraction | Out-Null
            $msiArguments = "/a `"$($installer.FullName)`" /qn TARGETDIR=`"$extraction`""
            $msiProcess = Start-Process -FilePath "msiexec.exe" `
              -ArgumentList $msiArguments `
              -Wait `
              -PassThru
            if ($msiProcess.ExitCode -ne 0) {
              throw "Administrative MSI extraction failed with exit $($msiProcess.ExitCode)"
            }
            $wintun = @(Get-ChildItem -Path $extraction -Recurse -File -Filter "wintun.dll")
            if ($wintun.Count -ne 1) {
              throw "Extracted MSI must contain exactly one wintun.dll, found $($wintun.Count)"
            }
            $hash = (Get-FileHash -LiteralPath $wintun[0].FullName `
              -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne `
              "e5da8447dc2c320edc0fc52fa01885c103de8c118481f683643cacc3220dafce") {
              throw "Packaged wintun.dll has unexpected SHA-256: $hash"
            }
          }
      - name: Upload Windows MSI bundle
        uses: actions/upload-artifact@v7
        with:
          name: quicfuscate-desktop-windows
          path: |
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.msi.sig
            scripts/out/build/windows/wintun-provenance.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Release publishing - creates a GitHub Release with all artifacts
  # ---------------------------------------------------------------------------
  publish-release:
    # Wait for ALL build jobs so their artifacts are available for download.
    # Both server architectures and all three signed desktop updater jobs are
    # required dependencies. A tag cannot publish a partial updater surface.
    needs:
      [
        linux-server-bundle,
        linux-server-bundle-arm64,
        desktop-macos,
        desktop-linux,
        desktop-windows,
      ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
      - name: Display structure
        run: find release-artifacts -type f | head -30
      - name: Generate and verify complete Tauri updater manifest
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          REPO="Christopher-Schulze/QuicFuscate"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"
          bash scripts/audits/verify-release-updater.sh \
            --artifact-root release-artifacts \
            --tag "$TAG" \
            --base-url "$BASE_URL" \
            --output latest.json \
            --runtime-source apps/tauri/src-tauri/src/main.rs
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Upload latest.json alongside other artifacts
          cp latest.json release-artifacts/
          # Only upload files (not directories). The server bundle artifact
          # contains a staging directory alongside the tarball; gh release
          # create cannot upload directories.
          FILES=$(find release-artifacts -type f)
          echo "Uploading files:"
          echo "$FILES"
          gh release create "$TAG" \
            --title "QuicFuscate $TAG" \
            --generate-notes \
            $FILES
