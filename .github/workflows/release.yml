name: Release Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  linux-server-bundle:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-linux-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release

      - name: Build admin web assets
        run: |
          bun install
          bash scripts/build/build-web-admin.sh

      - name: Create server bundle
        run: |
          bash scripts/build/build-server-bundle.sh \
            --binary ./target/release/quicfuscate \
            --assets ./assets/web-admin

      - name: Upload server bundle
        uses: actions/upload-artifact@v4
        with:
          name: quicfuscate-server-linux
          path: |
            scripts/out/build/*.tar.gz
            scripts/out/build/checksums-sha256.txt
            scripts/out/build/checksums-sha256.txt.sig
          if-no-files-found: error

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: quicfuscate-linux-binary
          path: target/release/quicfuscate

      - name: Generate checksums and signatures
        # The checksum file must NOT be hashed itself. Writing it in-place
        # via `sha256sum * > checksums-sha256.txt` would create the (empty)
        # file before glob expansion, so `*` would include it and produce a
        # self-referential entry that fails `sha256sum -c` verification.
        # We therefore write to a temp file and move it into place after.
        # Also, build-server-bundle.sh leaves a staging directory alongside
        # the tarball; sha256sum cannot hash directories, so we only hash
        # files (*.tar.gz, not the unpacked staging dir).
        run: |
          cd scripts/out/build/
          # SHA-256 checksums for all bundle artifacts (files only, excluding
          # the checksum file itself, which doesn't exist yet during globbing,
          # and excluding staging directories left by build-server-bundle.sh).
          tmp=$(mktemp)
          find . -maxdepth 1 -type f ! -name 'checksums-sha256.txt' -exec sha256sum {} + > "$tmp"
          mv "$tmp" checksums-sha256.txt
          # GPG signature if signing key is configured (optional)
          if [ -n "${{ secrets.RELEASE_GPG_KEY_ID }}" ]; then
            echo "GPG signing key configured — signing checksums"
            echo "${{ secrets.RELEASE_GPG_PRIVATE_KEY }}" | gpg --import
            gpg --detach-sign --local-user "${{ secrets.RELEASE_GPG_KEY_ID }}" \
              --output checksums-sha256.txt.sig checksums-sha256.txt
          else
            echo "No GPG signing key configured — checksums only (no signature)"
          fi

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: quicfuscate-checksums
          path: |
            scripts/out/build/checksums-sha256.txt
            scripts/out/build/checksums-sha256.txt.sig
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Desktop builds (Tauri) — macOS and Linux (non-blocking)
  # ---------------------------------------------------------------------------
  # These jobs build the Tauri desktop app bundles with updater signing.
  # The frontend (svelte-desktop) is built as part of the Tauri build process
  # via beforeBuildCommand. No UI changes are made; these jobs only package
  # the existing frontend into native bundles.
  #
  # These jobs are non-blocking (continue-on-error): if a desktop build fails,
  # the server release still publishes. The latest.json generation in
  # publish-release gracefully omits platforms whose updater bundles are
  # missing. Desktop artifacts that do succeed are still downloaded and
  # included in the GitHub Release.
  #
  # Windows is not included: the core QUIC library uses Unix-specific syscalls
  # (libc::iovec, libc::msghdr, std::os::unix) in transport/batch.rs and
  # other modules that are not yet cfg-gated for Windows. See TODO-519.
  # ---------------------------------------------------------------------------
  desktop-macos:
    runs-on: macos-latest
    continue-on-error: true
    env:
      CARGO_INCREMENTAL: "0"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0.0"
      - name: Install dependencies
        run: |
          cd apps/svelte-desktop && bun install
          cd ../../ && bun install
      - name: Build Tauri desktop app (macOS)
        working-directory: apps/tauri/src-tauri
        run: cargo tauri build --target aarch64-apple-darwin
      - name: Upload macOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: quicfuscate-desktop-macos
          # NOTE: .cargo/config.toml sets target-dir = "target" at the repo
          # root, so the Tauri build output lands in <repo-root>/target/...
          # even though `cargo tauri build` is invoked with
          # working-directory: apps/tauri/src-tauri. Do NOT use
          # apps/tauri/src-tauri/target/ here — that directory never exists.
          path: |
            target/aarch64-apple-darwin/release/bundle/**/*.dmg
            target/aarch64-apple-darwin/release/bundle/**/*.app.tar.gz
            target/aarch64-apple-darwin/release/bundle/**/*.app.tar.gz.sig
          if-no-files-found: warn

  desktop-linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CARGO_INCREMENTAL: "0"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0.0"
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            libglib2.0-dev
      - name: Install dependencies
        run: |
          cd apps/svelte-desktop && bun install
          cd ../../ && bun install
      - name: Build Tauri desktop app (Linux)
        working-directory: apps/tauri/src-tauri
        run: cargo tauri build
      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: quicfuscate-desktop-linux
          # NOTE: .cargo/config.toml sets target-dir = "target" at the repo
          # root, so the Tauri build output lands in <repo-root>/target/...
          # even though `cargo tauri build` is invoked with
          # working-directory: apps/tauri/src-tauri. Do NOT use
          # apps/tauri/src-tauri/target/ here — that directory never exists.
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.deb.sig
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.AppImage.sig
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Release publishing — creates a GitHub Release with all artifacts
  # ---------------------------------------------------------------------------
  publish-release:
    # Wait for ALL build jobs so their artifacts are available for download.
    # The desktop jobs have continue-on-error: true, so a desktop build
    # failure does NOT block publish-release — the job is treated as
    # success for needs resolution. This ensures artifacts from successful
    # desktop builds are present when actions/download-artifact runs.
    needs: [linux-server-bundle, desktop-macos, desktop-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Display structure
        run: find release-artifacts -type f | head -30
      - name: Generate latest.json for Tauri updater
        # Generate the Tauri updater manifest with python3 so the output is
        # guaranteed-valid JSON regardless of signature content (minisign sigs
        # contain newlines) or which desktop builds succeeded. Platforms whose
        # signed updater bundles are missing are omitted from the manifest.
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          REPO="Christopher-Schulze/QuicFuscate"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"
          export TAG VERSION BASE_URL

          # Locate signed updater bundles (if any). The find invocations are
          # safe even if no desktop artifacts were downloaded.
          # macOS: Tauri generates .app.tar.gz + .app.tar.gz.sig (updater archive)
          # Linux: Tauri generates .AppImage + .AppImage.sig (signed directly, no archive)
          MACOS_TGZ=$(find release-artifacts -name "*.app.tar.gz" ! -name "*.sig" 2>/dev/null | head -1)
          MACOS_SIG=$(find release-artifacts -name "*.app.tar.gz.sig" 2>/dev/null | head -1)
          LINUX_IMG=$(find release-artifacts -name "*.AppImage" ! -name "*.sig" 2>/dev/null | head -1)
          LINUX_SIG=$(find release-artifacts -name "*.AppImage.sig" 2>/dev/null | head -1)
          export MACOS_TGZ MACOS_SIG LINUX_IMG LINUX_SIG

          python3 - <<'PYEOF'
          import json
          import os
          from datetime import datetime, timezone

          tag = os.environ["TAG"]
          version = os.environ["VERSION"]
          base_url = os.environ["BASE_URL"]

          def platform_entry(tgz, sig):
              """Return (url, signature) if both bundle and signature exist, else None."""
              if not tgz or not sig:
                  return None
              if not os.path.isfile(tgz) or not os.path.isfile(sig):
                  return None
              url = f"{base_url}/{os.path.basename(tgz)}"
              with open(sig, "r", encoding="utf-8") as f:
                  signature = f.read()
              return {"signature": signature, "url": url}

          platforms = {}
          macos = platform_entry(os.environ.get("MACOS_TGZ", ""), os.environ.get("MACOS_SIG", ""))
          if macos:
              platforms["darwin-aarch64"] = macos
          linux = platform_entry(os.environ.get("LINUX_IMG", ""), os.environ.get("LINUX_SIG", ""))
          if linux:
              platforms["linux-x86_64"] = linux

          if not platforms:
              print("::warning::No signed desktop updater bundles found. "
                    "latest.json will have empty platforms.")

          manifest = {
              "version": version,
              "notes": f"QuicFuscate {tag}",
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }

          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PYEOF

          echo "Generated latest.json:"
          cat latest.json
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Upload latest.json alongside other artifacts
          cp latest.json release-artifacts/
          # Only upload files (not directories). The server bundle artifact
          # contains a staging directory alongside the tarball; gh release
          # create cannot upload directories.
          FILES=$(find release-artifacts -type f)
          echo "Uploading files:"
          echo "$FILES"
          gh release create "$TAG" \
            --title "QuicFuscate $TAG" \
            --generate-notes \
            $FILES
