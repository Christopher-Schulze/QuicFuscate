name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required push set only. Parked lanes were removed from this workflow so
  # GitHub does not count skipped jobs against the commit check rollup.
  build-test:
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Keep the local TODO registry out of the public tree
        shell: bash
        run: |
          if git ls-files -- docs/todo.md docs/todo/ | grep -q .; then
            echo 'Internal TODO files must not be tracked.' >&2
            exit 1
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "stable"
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Lean push gate: strict Clippy plus the library suite and the targeted
      # platform contracts. The full --all-targets suite and release/workspace
      # builds run on the developer machine; tagged release builds are owned by
      # release.yml.
      - name: Run Clippy
        shell: bash
        run: |
          # The documented contract is strict all-target Clippy with rust-tests. Without that
          # feature the test-only targets and every rust-tests-gated path were linted in their
          # disabled form, so a warning there could not fail this gate.
          cargo clippy --workspace --all-targets --locked --features rust-tests -- -D warnings

      - name: Run library tests
        shell: bash
        run: |
          cargo test --workspace --lib --features rust-tests --locked

      - name: Test macOS Unix TUN syscall contracts
        shell: bash
        run: |
          cargo test --locked --lib --features rust-tests \
            interface::tests::unix_ -- --nocapture
          cargo test --locked --lib --features rust-tests \
            interface::macos_tun::tests::utun_writev_iovecs_follow_bounded_progress \
            -- --exact --nocapture
          cargo test --locked --lib --features rust-tests \
            implementations::client::platform::traits::tests::tun_handle_close_failure_is_reported_and_terminalized \
            -- --exact --nocapture

      - name: Run privilege, memory-lock, and TLS negative-proof suite
        shell: bash
        run: |
          cargo test --locked --lib --features rust-tests \
            qftls::tests::native_rejected_preload_values_release_only_their_own_key_mapping \
            -- --ignored --exact --nocapture --test-threads=1
          scripts/tests/suites/test-privilege-memory-tls-proof.sh \
            --output-dir scripts/out/tests/privilege-memory-tls-proof

      - name: Upload privilege, memory-lock, and TLS proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: privilege-memory-tls-proof
          path: scripts/out/tests/privilege-memory-tls-proof/
          if-no-files-found: error

  linux-transport-uring:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "stable"

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run io_uring transport suites
        shell: bash
        run: |
          # The only platform-gated suites the macOS gate can never cover.
          # They accept both kernel contracts: the issue-time error CQE and
          # the kernel >= 6.17 prep-time short-submit quarantine (TODO-1004).
          cargo test --locked --features "rust-tests io_uring" \
            --test rt-transport-uring --test rt-io-hotpath-kernel-integration

      - name: Native x86_64 provider/persona baseline
        shell: bash
        run: |
          # TODO-883 native matrix: the same rust-tests filters that prove the
          # rustls provider order, per-persona live standard-suite handshakes,
          # packet-protection ownership, 0-RTT default-off, and key update on
          # ARM64 must also pass on hosted x86_64 at the same revision.
          cargo test --locked --features "rust-tests io_uring" --lib -- \
            qftls:: early_data key_update packet_protection

  linux-private-required-e2e:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "stable"

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install netns test dependencies
        run: sudo apt-get update && sudo apt-get install -y tcpdump netcat-openbsd

      - name: Build release binaries
        run: cargo build --locked --release --bin quicfuscate --bin qf-aead-wire-proof

      - name: Write opt-in required and standard peer configs
        run: |
          mkdir -p /tmp/qf885
          cat > /tmp/qf885/required.toml <<'EOF'
          [crypto]
          packet_protection_mode = "advanced-required"
          aead_preference = "aegis"

          [stealth]
          mode = "manual"
          enable_http3_masquerading = false
          use_qpack_headers = false
          enable_protocol_mimicry = false
          enable_traffic_padding = false
          enable_timing_obfuscation = false
          use_tls_cover = false
          enable_doh = false
          EOF
          cat > /tmp/qf885/server-standard.toml <<'EOF'
          [crypto]
          packet_protection_mode = "standard"

          [stealth]
          mode = "manual"
          enable_http3_masquerading = false
          use_qpack_headers = false
          enable_protocol_mimicry = false
          enable_traffic_padding = false
          enable_timing_obfuscation = false
          use_tls_cover = false
          enable_doh = false
          EOF

      - name: Live advanced-required pair proof
        run: |
          sudo -E env \
            QF_E2E_BINARY="$PWD/target/release/quicfuscate" \
            QF_E2E_SERVER_CONFIG=/tmp/qf885/required.toml \
            QF_E2E_CLIENT_CONFIG=/tmp/qf885/required.toml \
            QF_E2E_KEYLOG_FILE=/tmp/qf885/pos-keylog.txt \
            QF_E2E_PRIVATE_DUMP_FILE=/tmp/qf885/pos-private.dump \
            QF_E2E_HANDSHAKE_CAPTURE_FILE=/tmp/qf885/pos-underlay.pcap \
            QF_E2E_LOG_DIR=/tmp/qf885/logs-pos \
            QF_E2E_STARTUP_TIMEOUT=30 \
            bash scripts/tests/tun-e2e-netns.sh

      - name: Wire proof of private post-boundary 1-RTT
        run: |
          sudo ./target/release/qf-aead-wire-proof \
            --pcap /tmp/qf885/pos-underlay.pcap \
            --keylog /tmp/qf885/pos-keylog.txt \
            --privdump /tmp/qf885/pos-private.dump \
            --expect private
          sudo rm -f /run/quicfuscate/routing/7174756e30.json \
            /run/quicfuscate/routing/firewall-owner.json || true

      - name: Live fail-closed proof against a standard peer
        run: |
          set +e
          sudo -E env \
            QF_E2E_BINARY="$PWD/target/release/quicfuscate" \
            QF_E2E_SERVER_CONFIG=/tmp/qf885/server-standard.toml \
            QF_E2E_CLIENT_CONFIG=/tmp/qf885/required.toml \
            QF_E2E_KEYLOG_FILE=/tmp/qf885/neg-keylog.txt \
            QF_E2E_HANDSHAKE_CAPTURE_FILE=/tmp/qf885/neg-underlay.pcap \
            QF_E2E_LOG_DIR=/tmp/qf885/logs-neg \
            QF_E2E_STARTUP_TIMEOUT=30 \
            bash scripts/tests/tun-e2e-netns.sh
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "FAIL: required client survived against a standard-only peer" >&2
            exit 1
          fi
          grep -q "private packet protection negotiation deadline expired" \
            /tmp/qf885/logs-neg/ns-cli.log || {
              echo "FAIL: missing deadline kill evidence in client log" >&2
              exit 1
            }
          # The payload gate must leave zero data-plane leakage: no captured
          # packet above the boundary may carry tunnel payload on the wire.
          sudo ./target/release/qf-aead-wire-proof \
            --pcap /tmp/qf885/neg-underlay.pcap \
            --keylog /tmp/qf885/neg-keylog.txt \
            --expect standard

      - name: Relax evidence permissions for upload
        if: always()
        run: sudo chmod -R a+r /tmp/qf885 || true

      - name: Upload required-e2e evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-private-required-e2e
          path: |
            /tmp/qf885/*.pcap
            /tmp/qf885/*.dump
            /tmp/qf885/*keylog.txt
            /tmp/qf885/logs-*/
          if-no-files-found: warn

  frontend-dependency-security:
    timeout-minutes: 15
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Verify locked frontend dependency security
        shell: bash
        run: bash scripts/audits/verify-frontend-dependencies.sh

  frontend-checks:
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install frontend workspaces
        shell: bash
        run: bun install --frozen-lockfile --no-progress

      - name: Admin typecheck and unit tests
        shell: bash
        working-directory: apps/svelte-admin
        run: |
          bun run check
          bun run test:unit

      - name: Desktop typecheck and unit tests
        shell: bash
        working-directory: apps/svelte-desktop
        run: |
          bun run check
          bun run test:unit

      - name: Shared UI unit tests
        shell: bash
        working-directory: packages/ui
        run: bun run test

      - name: Production bundles and size budget
        shell: bash
        run: |
          # Bun 1.4 treats `bun run build --cwd <dir>` as a root script named
          # "build". The workspace flag must come before the script name, or
          # the step must enter the app directory first.
          (cd apps/svelte-admin && bun run build)
          (cd apps/svelte-desktop && bun run build)
          bash scripts/audits/verify-frontend-bundle-budget.sh

  frontend-e2e:
    timeout-minutes: 40
    runs-on: macos-latest
    needs: [frontend-checks]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install frontend workspaces
        shell: bash
        run: bun install --frozen-lockfile --no-progress

      - name: Install Playwright Chromium
        shell: bash
        working-directory: apps/svelte-admin
        run: bun run test:e2e:install

      - name: Admin Playwright E2E
        shell: bash
        working-directory: apps/svelte-admin
        run: bun run test:e2e

      - name: Desktop Playwright E2E
        shell: bash
        working-directory: apps/svelte-desktop
        run: bun run test:e2e

      - name: Upload desktop e2e failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-e2e-test-results
          path: apps/svelte-desktop/test-results
          if-no-files-found: ignore
          retention-days: 14

  app-backend-checks:
    timeout-minutes: 25
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "stable"
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-tauri-host-${{ hashFiles('apps/tauri/src-tauri/Cargo.lock') }}

      - name: Materialize Tauri frontendDist for compile
        shell: bash
        run: mkdir -p apps/svelte-desktop/build

      - name: Tauri host Clippy
        shell: bash
        working-directory: apps/tauri/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tauri host tests
        shell: bash
        working-directory: apps/tauri/src-tauri
        run: cargo test --locked
