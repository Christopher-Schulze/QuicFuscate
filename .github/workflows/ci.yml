name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Svelte desktop check + unit tests
        shell: bash
        working-directory: apps/svelte-desktop
        run: |
          bun run check
          bun run test:unit

      - name: Svelte admin check + unit tests
        shell: bash
        working-directory: apps/svelte-admin
        run: |
          bun run check
          bun run test:unit

      - name: Bounded frontend preview lifecycle tests
        shell: bash
        working-directory: apps/svelte-admin
        run: bun run test:serve:codex

  frontend-dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Verify locked frontend dependency security
        shell: bash
        run: bash scripts/audits/verify-frontend-dependencies.sh

  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        shell: bash
        working-directory: apps/svelte-admin
        run: bun run test:e2e:install -- --with-deps

      - name: Svelte admin full E2E suite
        shell: bash
        working-directory: apps/svelte-admin
        run: |
          bun run test:e2e

      - name: Svelte desktop full E2E suite
        shell: bash
        working-directory: apps/svelte-desktop
        run: |
          bun run test:e2e

      - name: Upload frontend E2E artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-e2e-results
          path: |
            apps/svelte-admin/test-results/
            apps/svelte-desktop/test-results/

  app-backend-checks:
    runs-on: macos-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/tauri/src-tauri/target
          key: ${{ runner.os }}-app-backend-${{ hashFiles('apps/tauri/src-tauri/Cargo.lock', 'Cargo.lock') }}

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop frontend bundle for Tauri context
        shell: bash
        working-directory: apps/svelte-desktop
        run: |
          bun run build

      - name: Check Tauri host backend
        shell: bash
        working-directory: apps/tauri/src-tauri
        run: |
          cargo metadata --locked --no-deps --format-version 1
          cargo check --locked

      - name: Lint Tauri host backend
        shell: bash
        working-directory: apps/tauri/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test Tauri host backend
        shell: bash
        working-directory: apps/tauri/src-tauri
        run: cargo test --locked

  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Pure Cargo build/test (no vendored external QUIC stack)

      - name: Run Clippy
        shell: bash
        run: |
          # The documented contract is strict all-target Clippy with rust-tests. Without that
          # feature the test-only targets and every rust-tests-gated path were linted in their
          # disabled form, so a warning there could not fail this gate.
          cargo clippy --workspace --all-targets --locked --features rust-tests -- -D warnings

      - name: Verify release compilation
        shell: bash
        run: |
          cargo build --workspace --release --locked

      - name: Run tests
        shell: bash
        run: |
          cargo test --workspace --all-targets --features rust-tests --locked

      - name: Test macOS Unix TUN syscall contracts
        shell: bash
        run: |
          cargo test --locked --lib --features rust-tests \
            interface::tests::unix_ -- --nocapture
          cargo test --locked --lib --features rust-tests \
            interface::macos_tun::tests::utun_writev_iovecs_follow_bounded_progress \
            -- --exact --nocapture
          cargo test --locked --lib --features rust-tests \
            implementations::client::platform::traits::tests::tun_handle_close_failure_is_reported_and_terminalized \
            -- --exact --nocapture

      - name: Run privilege, memory-lock, and TLS negative-proof suite
        shell: bash
        run: |
          cargo test --locked --lib --features rust-tests \
            qftls::tests::native_rejected_preload_values_release_only_their_own_key_mapping \
            -- --ignored --exact --nocapture --test-threads=1
          scripts/tests/suites/test-privilege-memory-tls-proof.sh \
            --output-dir scripts/out/tests/privilege-memory-tls-proof

      - name: Upload privilege, memory-lock, and TLS proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: privilege-memory-tls-proof
          path: scripts/out/tests/privilege-memory-tls-proof/
          if-no-files-found: error

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-binaries
          path: |
            target/release/quicfuscate*
            target/release/*.dll
            target/release/*.dylib
            target/release/*.so

  windows-core-checks:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-core-${{ hashFiles('Cargo.lock') }}

      - name: Check Windows Wintun core library
        run: cargo check --locked --lib --features tun-windows,rust-tests

      - name: Compile Windows Wintun tests
        run: cargo test --locked --lib --features tun-windows,rust-tests --no-run

      - name: Build Windows Wintun CLI
        run: cargo build --locked --bin quicfuscate --features tun-windows

      - name: Provision verified upstream Wintun
        shell: pwsh
        run: |
          ./scripts/utils/provision-wintun.ps1 `
            -DestinationDirectory "target/debug" `
            -EvidencePath "scripts/out/tests/wintun-native/wintun-cli-provenance.json"
          ./scripts/utils/provision-wintun.ps1 `
            -DestinationDirectory "target/debug/deps" `
            -EvidencePath "scripts/out/tests/wintun-native/wintun-provenance.json"

      - name: Test Windows CLI startup and stale WFP cleanup
        shell: pwsh
        run: |
          & "target/debug/quicfuscate.exe" client `
            --remote "127.0.0.1:4433" `
            --cleanup-firewall
          if ($LASTEXITCODE -ne 0) {
            throw "Windows CLI stale WFP cleanup exited with $LASTEXITCODE"
          }
          [ordered]@{
            schema = "quicfuscate.windows-cli-startup.v1"
            git_sha = $env:GITHUB_SHA
            cleanup_exit_code = $LASTEXITCODE
          } | ConvertTo-Json | Set-Content `
            -LiteralPath "scripts/out/tests/wintun-native/windows-cli-startup.json" `
            -Encoding utf8

      - name: Test Windows Wintun core library
        run: cargo test --locked --lib --features tun-windows,rust-tests

      - name: Test Windows zero-copy memory-pool contracts
        run: cargo test --locked --package qf-memory-pool --features rust-tests

      - name: Test Windows WFP cleanup ownership fault contracts
        run: >-
          cargo test --locked --lib --features tun-windows,rust-tests
          implementations::client::killswitch::windows::tests::wfp_
          -- --nocapture --test-threads=1

      - name: Test privileged Wintun adapter lifecycle
        run: >-
          cargo test --locked --lib --features tun-windows,rust-tests
          interface::wintun::tests::native_
          -- --ignored --nocapture --test-threads=1

      - name: Test privileged Windows WFP kill switch
        run: >-
          cargo test --locked --lib --features tun-windows,rust-tests
          interface::wintun::tests::wfp_native_packet_policy_and_cleanup
          -- --ignored --exact --nocapture --test-threads=1

      - name: Verify zero Windows WFP object residue
        if: always()
        run: >-
          cargo test --locked --lib --features tun-windows,rust-tests
          implementations::client::killswitch::windows::tests::native_wfp_managed_objects_are_absent
          -- --ignored --exact --nocapture --test-threads=1

      - name: Verify zero Wintun adapter residue
        if: always()
        shell: pwsh
        run: |
          $residue = @(Get-NetAdapter -Name "QuicFuscate-CI-*" -IncludeHidden `
            -ErrorAction SilentlyContinue)
          if ($residue.Count -ne 0) {
            $residue | Format-Table -AutoSize | Out-String | Write-Error
            throw "Native Wintun tests left $($residue.Count) owned adapter(s)"
          }
          $firewallResidue = @(Get-NetFirewallRule `
            -DisplayName "QuicFuscate-CI-Wintun-*" -ErrorAction SilentlyContinue)
          if ($firewallResidue.Count -ne 0) {
            $firewallResidue | Format-Table -AutoSize | Out-String | Write-Error
            throw "Native Wintun tests left $($firewallResidue.Count) owned firewall rule(s)"
          }
          $os = Get-CimInstance Win32_OperatingSystem
          [ordered]@{
            schema = "quicfuscate.wintun-native.v1"
            git_sha = $env:GITHUB_SHA
            windows_caption = $os.Caption
            windows_version = $os.Version
            windows_build = $os.BuildNumber
            adapter_residue = 0
            firewall_rule_residue = 0
          } | ConvertTo-Json | Set-Content `
            -LiteralPath "scripts/out/tests/wintun-native/windows-runtime.json" `
            -Encoding utf8

      - name: Record interface and platform negative-proof boundary
        if: always()
        shell: pwsh
        run: |
          $architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          $evidence = [ordered]@{
            schema = "quicfuscate.interface_platform_negative_proof.v1"
            status = "BOUNDARY_DECLARED"
            git_sha = $env:GITHUB_SHA
            host_os = "windows"
            host_arch = $architecture
            generic_interface_status = "EXECUTED_BY_WINDOWS_CORE_LIBRARY"
            unix_syscall_status = "NOT_APPLICABLE"
            wintun_deterministic_status = "EXECUTED_BY_WINDOWS_CORE_LIBRARY"
            wintun_native_cleanup_fault_status = "UNAVAILABLE"
            wintun_native_cleanup_fault_reason = "requires injectable Win32 SetEvent CloseHandle FreeLibrary failures"
            wfp_deterministic_status = "EXECUTED_BY_EXACT_CI_STEP"
            wfp_native_cleanup_fault_status = "UNAVAILABLE"
            wfp_native_cleanup_fault_reason = "requires BFE or Fwpm failure injection plus residue verification"
            unsupported_isa_status = "HOST_CONDITIONAL"
            native_prerequisites = "administrator_verified_wintun_dll_base_filtering_engine"
          }
          New-Item -ItemType Directory -Force -Path "scripts/out/tests/wintun-native" | Out-Null
          $evidence | ConvertTo-Json -Depth 4 | Set-Content `
            -LiteralPath "scripts/out/tests/wintun-native/interface-platform-negative-proof.json" `
            -Encoding utf8

      - name: Lint Windows Wintun core library
        run: cargo clippy --locked --lib --features tun-windows,rust-tests -- -D warnings

      - name: Upload native Wintun evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wintun-native-evidence
          path: scripts/out/tests/wintun-native/
          if-no-files-found: error

  simd-feature-contract:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"

      - name: Verify truthful Cargo SIMD feature contract
        run: bash scripts/audits/verify-simd-feature-contract.sh

      - name: Verify AMX build/runtime proof wiring
        run: bash scripts/audits/verify-amx-proof-contract.sh

      - name: Verify Cargo feature taxonomy contract
        run: bash scripts/audits/verify-cargo-feature-taxonomy.sh

  amx-proof-lane:
    name: AMX Build and Runtime Proof Lane
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"

      - name: Run AMX proof lane
        shell: bash
        run: |
          set +e
          bash scripts/tests/suites/test-amx-proof.sh --output-dir scripts/out/tests/amx-proof
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            exit "$rc"
          fi
          echo "AMX proof lane completed with explicit status rc=$rc"

      - name: Validate AMX proof artifact
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("scripts/out/tests/amx-proof/results.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["schema"] == "quicfuscate.v1"
          summary = next(item for item in payload["items"] if item.get("name") == "amx_proof_summary")
          assert summary["status"] in {"PASS", "UNAVAILABLE"}
          assert all(item.get("status") != "SKIP" for item in payload["items"])
          print(f"AMX proof artifact status: {summary['status']}")
          PY

      - name: Upload AMX proof evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: amx-proof-evidence
          path: scripts/out/tests/amx-proof/
          if-no-files-found: error

  feature-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: "simd-selfcheck"
          - os: macos-latest
            features: ""
          - os: macos-latest
            features: "simd-selfcheck"
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: "Run feature matrix (features: ${{ matrix.features }})"
        shell: bash
        run: |
          if [ "${{ matrix.features }}" = "simd-selfcheck" ]; then
            simd_output="${RUNNER_TEMP}/quicfuscate-simd-selfcheck.log"
            if ! cargo test --workspace --locked \
              --features rust-tests,simd-selfcheck \
              --test rt-simd-selfcheck -- --nocapture >"$simd_output" 2>&1; then
              cat "$simd_output"
              exit 1
            fi
            cat "$simd_output"
            grep -Fq "test varint_roundtrip_and_consistency ... ok" "$simd_output"
          elif [ -n "${{ matrix.features }}" ]; then
            cargo test --workspace --all-targets --locked \
              --features "rust-tests,${{ matrix.features }}"
          else
            cargo test --workspace --all-targets --features rust-tests --locked
          fi

  linux-fastpath-gates:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-fastpath-${{ hashFiles('**/Cargo.lock') }}

      - name: Prove native Linux resolver ownership
        shell: bash
        run: |
          if [[ "$(uname -s)" != "Linux" ]]; then
            echo "native resolver proof requires Linux" >&2
            exit 1
          fi
          if [[ "$(id -u)" -eq 0 ]]; then
            echo "native resolver proof requires an unprivileged runner" >&2
            exit 1
          fi
          mkdir -p scripts/out/tests/linux-resolver-ownership
          resolver_log="scripts/out/tests/linux-resolver-ownership/proof.log"
          cargo test --locked --lib --features rust-tests \
            implementations::client::platform::dns_restore::tests:: -- \
            --nocapture --test-threads=1 2>&1 | tee "$resolver_log"
          grep -Fq "test result: ok. 15 passed; 0 failed" "$resolver_log"
          cargo test --locked --lib --features rust-tests \
            implementations::client::platform::linux::tests::resolver_ -- \
            --nocapture --test-threads=1 2>&1 | tee -a "$resolver_log"
          grep -Fq "test result: ok. 3 passed; 0 failed" "$resolver_log"
          echo "LINUX_RESOLVER_OWNERSHIP_PROOF status=PASS dns_restore=15 resolver_paths=3 unprivileged=1" \
            | tee -a "$resolver_log"

      - name: Test Linux Unix TUN syscall contracts
        shell: bash
        run: |
          cargo test --locked --lib --features rust-tests \
            interface::tests::unix_ -- --nocapture
          cargo test --locked --lib --features rust-tests \
            implementations::client::platform::linux::tests::compatibility_kernel_name_contract_rejects_unterminated_identity \
            -- --exact --nocapture
          cargo test --locked --lib --features rust-tests \
            implementations::client::platform::traits::tests::tun_handle_close_failure_is_reported_and_terminalized \
            -- --exact --nocapture

      - name: Test Linux TLS key-lock ownership
        shell: bash
        run: |
          cargo test --locked --lib --features rust-tests \
            qftls::tests::native_rejected_preload_values_release_only_their_own_key_mapping \
            -- --ignored --exact --nocapture --test-threads=1

      - name: Prove native Linux privilege reduction
        shell: bash
        run: |
          scripts/tests/suites/test-privilege-memory-tls-proof.sh \
            --require-native-privilege \
            --output-dir scripts/out/tests/linux-privilege-proof

      - name: Run Linux fastpath transport suite
        shell: bash
        run: |
          bash scripts/tests/suites/test-transport.sh --output-dir scripts/out/tests/linux-fastpath-gates

      - name: Upload Linux fastpath artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-fastpath-gates
          path: |
            scripts/out/tests/linux-fastpath-gates
            scripts/out/tests/linux-privilege-proof
            scripts/out/tests/linux-resolver-ownership

  linux-firewall-ownership-native:
    name: Linux firewall ownership (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [nftables, iptables]
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-firewall-${{ matrix.backend }}-${{ hashFiles('Cargo.lock') }}

      - name: Install native firewall proof dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dnsutils \
            iproute2 \
            iptables \
            iputils-ping \
            netcat-openbsd \
            nftables \
            openssl \
            tcpdump

      - name: Build exact firewall proof artifact
        run: cargo build --locked --release --bin quicfuscate

      - name: Prove native firewall ownership and cleanup
        shell: bash
        run: |
          set -o pipefail
          output_dir="scripts/out/tests/firewall-ownership-${{ matrix.backend }}"
          mkdir -p "$output_dir"
          set +e
          sudo --preserve-env=GITHUB_SHA \
            env BINARY="$GITHUB_WORKSPACE/target/release/quicfuscate" \
            FIREWALL_BACKEND="${{ matrix.backend }}" \
            PROJECT_ROOT="$GITHUB_WORKSPACE" \
            scripts/tests/tun-e2e-killswitch-netns.sh \
            2>&1 | tee "$output_dir/proof.log"
          proof_status="${PIPESTATUS[0]}"
          set -e
          if [ "$proof_status" -ne 0 ]; then
            for runtime_log in \
              /tmp/qf-killswitch-server.log \
              /tmp/qf-killswitch-server-secondary.log \
              /tmp/qf-killswitch-client.log; do
              if sudo test -f "$runtime_log"; then
                diagnostic_log="$output_dir/$(basename "$runtime_log").diagnostics.log"
                sudo grep -Eia \
                  'error|fail|refus|firewall|routing|tun|panic|unsupported|unavailable' \
                  "$runtime_log" >"$diagnostic_log" || true
                tail -n 100 "$diagnostic_log"
              fi
            done
            exit "$proof_status"
          fi
          grep -Fq \
            "QF_FIREWALL_OWNERSHIP_STATUS=SUPPORTED backend=${{ matrix.backend }}" \
            "$output_dir/proof.log"

      - name: Upload native firewall ownership evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: firewall-ownership-${{ matrix.backend }}
          path: scripts/out/tests/firewall-ownership-${{ matrix.backend }}/
          if-no-files-found: error

  linux-traffic-analysis-native:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-traffic-analysis-${{ hashFiles('Cargo.lock') }}

      - name: Install native capture dependencies
        run: sudo apt-get update && sudo apt-get install -y iproute2 netcat-openbsd tcpdump

      - name: Build exact traffic-analysis artifact
        run: cargo build --locked --release --bin quicfuscate

      - name: Prove fail-closed Linux TUN provisioning and rollback
        shell: bash
        run: >-
          sudo --preserve-env=GITHUB_SHA
          env QF_E2E_BINARY="$GITHUB_WORKSPACE/target/release/quicfuscate"
          QF_TUN_PROVISIONING_KEEP=1
          PROJECT_ROOT="$GITHUB_WORKSPACE"
          scripts/tests/tun-provisioning-negative-netns.sh

      - name: Normalize native TUN provisioning evidence ownership
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          runtime_dirs=(/tmp/quicfuscate-tun-provisioning.*)
          if ((${#runtime_dirs[@]} > 0)); then
            sudo chown -R -- "$(id -u):$(id -g)" "${runtime_dirs[@]}"
          fi

      - name: Prove native server IPv4 PTB for DF=0
        shell: bash
        run: |
          native_ptb_ca_dir="$(mktemp -d "$RUNNER_TEMP/quicfuscate-ptb-ca.XXXXXX")"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -keyout "$native_ptb_ca_dir/ca.key" \
            -out "$native_ptb_ca_dir/ca.crt" \
            -subj '/CN=QuicFuscate native PTB gate' \
            >/dev/null 2>&1
          sudo --preserve-env=GITHUB_SHA \
            env QF_E2E_BINARY="$GITHUB_WORKSPACE/target/release/quicfuscate" \
            QF_E2E_CA="$native_ptb_ca_dir/ca.crt" \
            QF_E2E_CA_KEY="$native_ptb_ca_dir/ca.key" \
            QF_E2E_ARTIFACT_DIR="$GITHUB_WORKSPACE/scripts/out/tests/server-ipv4-ptb-native" \
            QF_E2E_THROUGHPUT_TRIAL_SECONDS=5 \
            QF_E2E_DEFER_PMTU_GAIN_GATE=1 \
            QF_E2E_SERVER_LOGGING_MODE=verbose \
            PROJECT_ROOT="$GITHUB_WORKSPACE" \
            scripts/tests/tun-e2e-multi-client-dual-stack-netns.sh

      - name: Normalize native server IPv4 PTB evidence ownership
        if: always()
        shell: bash
        run: |
          if [ -d "$GITHUB_WORKSPACE/scripts/out/tests/server-ipv4-ptb-native" ]; then
            sudo chown -R "$(id -u):$(id -g)" \
              "$GITHUB_WORKSPACE/scripts/out/tests/server-ipv4-ptb-native"
          fi

      - name: Upload native server IPv4 PTB evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: server-ipv4-ptb-native
          path: scripts/out/tests/server-ipv4-ptb-native/
          if-no-files-found: error

      - name: Prove native traffic-analysis cadence and cost
        shell: bash
        run: >-
          sudo --preserve-env=GITHUB_SHA
          env QF_E2E_BINARY="$GITHUB_WORKSPACE/target/release/quicfuscate"
          QF_TRAFFIC_OUTPUT_DIR="$GITHUB_WORKSPACE/scripts/out/tests/traffic-analysis-native"
          scripts/tests/tun-e2e-traffic-analysis-netns.sh

      - name: Upload native traffic-analysis evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: traffic-analysis-native
          path: scripts/out/tests/traffic-analysis-native/
          if-no-files-found: error

      - name: Upload native TUN provisioning evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tun-provisioning-negative-native
          path: /tmp/quicfuscate-tun-provisioning.*
          if-no-files-found: warn

  linux-installer-native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install native installer proof dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            debian-archive-keyring \
            dnf \
            gawk \
            rpm \
            shellcheck \
            systemd-container

      - name: Build real admin web publish tree
        shell: bash
        working-directory: apps/svelte-admin
        run: |
          bun install --frozen-lockfile --no-progress
          bun run build

      - name: Prove AlmaLinux and Debian installer lifecycles
        shell: bash
        run: |
          scripts/tests/suites/test-linux-installer.sh \
            --output-dir scripts/out/tests/linux-installer-native \
            --assets apps/svelte-admin/build

      - name: Upload native Linux installer evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-installer-native
          path: scripts/out/tests/linux-installer-native/
          if-no-files-found: error

  security-audit:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"

      - name: Install cargo-audit
        run: cargo install cargo-audit --version "0.22.2" --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --version "0.19.0" --locked

      - name: Run cargo audit
        run: cargo audit --deny warnings

      - name: Run locked Tauri dependency gates
        shell: bash
        run: bash scripts/audits/verify-tauri-dependencies.sh

  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Release version consistency audit
        shell: bash
        run: bash scripts/audits/verify-release-version.sh

      - name: Dependency reproducibility audit
        shell: bash
        run: bash scripts/audits/verify-reproducible-dependencies.sh

      - name: Verify generated web-admin publish contract
        shell: bash
        run: bash scripts/audits/verify-web-admin-publish-contract.sh

      - name: Verify TLS ClientHello ownership contract
        shell: bash
        run: bash scripts/audits/verify-tls-clienthello-contract.sh

  fuzz-targets:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      CARGO_INCREMENTAL: "0"
      ASAN_OPTIONS: "detect_odr_violation=0"
      FUZZ_DURATION: ${{ github.event_name == 'pull_request' && '60' || '120' }}
      FUZZ_JOBS: "2"
    steps:
      - uses: actions/checkout@v7

      - name: Set up nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --version "0.13.2" --locked

      - name: Verify fuzz contract
        run: bash scripts/audits/verify-fuzz-contract.sh

      - name: Run all fuzz targets with AddressSanitizer
        run: RUSTFLAGS="-Zsanitizer=address" bash scripts/tests/fuzz/run-ci-fuzz.sh

      - name: Upload crash artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-crashes
          path: scripts/tests/fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # TODO-154: Performance Regression Detection (criterion + critcmp)
  # ---------------------------------------------------------------------------
  benchmarks:
    runs-on: ubuntu-latest
    needs: [build-test]
    if: github.event_name == 'pull_request'
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"

      - name: Cache cargo registry + criterion baselines
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            bench-

      - name: Install critcmp
        run: cargo install critcmp --version "0.1.8" --locked

      - name: Run baseline benchmarks (main)
        shell: bash
        run: |
          # Every step here used to be masked with `|| true`, so a missing baseline, a failed
          # checkout, a failed benchmark, or a failed restore all reported success. The PR
          # comparison could then measure against an unknown tree, or later steps could run
          # against a baseline-only or mixed checkout, while the job stayed green.
          set -euo pipefail

          pr_tree="$(git rev-parse HEAD^{tree})"
          echo "pr_tree=$pr_tree"

          baseline_ref=""
          for candidate in origin/main main; do
            if git rev-parse --verify --quiet "$candidate^{commit}" >/dev/null; then
              baseline_ref="$candidate"
              break
            fi
          done
          if [ -z "$baseline_ref" ]; then
            echo "::error::no baseline ref (origin/main or main) is available; refusing a green comparison against an unknown tree"
            exit 1
          fi
          baseline_commit="$(git rev-parse "$baseline_ref")"
          baseline_tree="$(git rev-parse "$baseline_ref^{tree}")"
          echo "baseline_ref=$baseline_ref"
          echo "baseline_commit=$baseline_commit"
          echo "baseline_tree=$baseline_tree"

          stashed=0
          restore() {
            local status=$?
            # Always put the PR tree back, even when the benchmark failed, so later steps and the
            # uploaded artifacts belong to the commit under test.
            git checkout --force HEAD -- . || {
              echo "::error::failed to restore the PR tree"
              exit 1
            }
            if [ "$stashed" = "1" ]; then
              git stash pop || {
                echo "::error::failed to pop the stash; the working tree is not the PR tree"
                exit 1
              }
              stashed=0
            fi
            local restored
            restored="$(git rev-parse HEAD^{tree})"
            if [ "$restored" != "$pr_tree" ]; then
              echo "::error::restored tree $restored does not match the PR tree $pr_tree"
              exit 1
            fi
            echo "restored_tree=$restored"
            exit "$status"
          }
          trap restore EXIT

          if ! git diff --quiet HEAD || [ -n "$(git status --porcelain --untracked-files=normal)" ]; then
            git stash push --include-untracked --message "ci-baseline-benchmark"
            stashed=1
          fi

          git checkout --force "$baseline_ref" -- .
          checked_out="$(git write-tree)"
          echo "checked_out_tree=$checked_out"

          # A benchmark failure is a real result, not something to swallow. If the bench target
          # genuinely does not exist on the baseline yet, that is a missing baseline and the
          # comparison must not be reported as green.
          cargo bench --bench ci_regression --features benches -- --save-baseline main

      - name: Run PR benchmarks and compare
        run: |
          bash scripts/benchmarks/bench-ci-regression.sh --baseline main --warn 15 --error 30

      - name: Upload criterion reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: criterion-reports
          path: target/criterion/

  # e2e-tls job removed: browser fingerprints are generated in-memory at runtime
  # (no .chlo files on disk). The job iterated non-existent directories and tested
  # nothing while consuming CI minutes. TLS correctness is covered by
  # rt-tls-cover-cipher and stealth/tests.rs integration tests.
