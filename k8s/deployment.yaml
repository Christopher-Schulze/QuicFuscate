# ==============================================================================
# QuicFuscate Kubernetes Deployment
# ==============================================================================
# Deploys the QuicFuscate server with TUN device access for VPN bridging.
#
# Requirements:
#   - The /dev/net/tun device must exist on the host node. The init container
#     runs `modprobe tun` to ensure the kernel module is loaded. On nodes where
#     the module is built-in or already loaded, modprobe exits 0 silently.
#   - The container runs privileged OR with NET_ADMIN + NET_BIND_SERVICE
#     capabilities to create the TUN interface and install iptables rules.
#   - hostPath /dev/net/tun is mounted so the container can open the device.
#
# Apply order: configmap.yaml -> secret.yaml -> deployment.yaml -> service.yaml
# ==============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quicfuscate
  namespace: quicfuscate
  labels:
    app.kubernetes.io/name: quicfuscate
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: Recreate
    # Recreate (not RollingUpdate): only one pod may own the TUN interface
    # and bind UDP 443 at a time. RollingUpdate would start a new pod before
    # the old one terminates, causing a port/device conflict.
  selector:
    matchLabels:
      app.kubernetes.io/name: quicfuscate
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quicfuscate
        app.kubernetes.io/component: server
    spec:
      # Run on nodes that have the TUN module available.
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # Init container ensures the tun kernel module is loaded on the host
      # before the server pod starts. This requires the container to be
      # privileged (or have SYS_MODULE capability) to run modprobe.
      initContainers:
        - name: load-tun-module
          image: alpine:3.20
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Ensuring tun kernel module is loaded..."
              modprobe tun 2>/dev/null || true
              if [ -e /dev/net/tun ]; then
                echo "/dev/net/tun is present."
              else
                echo "WARNING: /dev/net/tun not found after modprobe." >&2
                echo "Ensure the tun module is available on the host kernel." >&2
              fi
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: tun-device
              mountPath: /dev/net/tun
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
      containers:
        - name: quicfuscate
          image: quicfuscate:0.4.0
          imagePullPolicy: IfNotPresent
          args:
            - server
            - --listen
            - 0.0.0.0:443
            - --cert
            - /etc/quicfuscate/certs/tls.crt
            - --key
            - /etc/quicfuscate/certs/tls.key
            - --config
            - /etc/quicfuscate/quicfuscate.toml
            - --tun
            - --tun-name
            - quicfuse0
            - --admin-web
            - 0.0.0.0:8080
            - --admin-web-root
            - /var/lib/quicfuscate/assets/web-admin
            - --admin-web-user
            - $(QUICFUSCATE_ADMIN_USER)
            - --admin-web-password
            - $(QUICFUSCATE_ADMIN_PASSWORD)
          env:
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: quicfuscate-config
                  key: rust_log
                  optional: true
            - name: QUICFUSCATE_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: quicfuscate-secret
                  key: admin_user
            - name: QUICFUSCATE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quicfuscate-secret
                  key: admin_password
            - name: QUICFUSCATE_QKEY_ENC_KEY
              valueFrom:
                secretKeyRef:
                  name: quicfuscate-secret
                  key: qkey_enc_key
                  optional: true
          ports:
            - name: quic
              containerPort: 443
              protocol: UDP
            - name: admin
              containerPort: 8080
              protocol: TCP
          # Privileged is required to create TUN interfaces and manage
          # iptables rules. If your policy disallows privileged pods, replace
          # with the focused capabilities below and ensure the runtime
          # supports /dev/net/tun passthrough.
          securityContext:
            privileged: true
            # capabilities:
            #   add:
            #     - NET_ADMIN
            #     - NET_BIND_SERVICE
            #     - NET_RAW
            #     - SYS_MODULE
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: 4000m
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/quicfuscate/quicfuscate.toml
              subPath: quicfuscate.toml
              readOnly: true
            - name: certs
              mountPath: /etc/quicfuscate/certs
              readOnly: true
            - name: tun-device
              mountPath: /dev/net/tun
            - name: state
              mountPath: /var/lib/quicfuscate
            - name: logs
              mountPath: /var/log/quicfuscate
          # Liveness: restart the pod if the admin HTTP server stops
          # responding. GET / serves the web-admin index.html (200, no auth).
          # A dedicated unauthenticated /api/health endpoint does not yet
          # exist (all /api/* routes except /api/login and /api/logout require
          # session auth and return 401). TODO: add /api/health to
          # admin_http.rs and switch these probes to it.
          livenessProbe:
            httpGet:
              path: /
              port: admin
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness: only route traffic when the server is healthy.
          readinessProbe:
            httpGet:
              path: /
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Graceful shutdown: the server flushes QKey state and closes TUN.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "kill -TERM 1"]
      terminationGracePeriodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: quicfuscate-config
            items:
              - key: quicfuscate.toml
                path: quicfuscate.toml
        - name: certs
          secret:
            secretName: quicfuscate-tls
        # hostPath: the TUN device must be a real char device on the host.
        - name: tun-device
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        # Host kernel modules (read-only) for the init container's modprobe.
        - name: lib-modules
          hostPath:
            path: /lib/modules
            type: Directory
        - name: state
          persistentVolumeClaim:
            claimName: quicfuscate-state
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: quicfuscate-state
  namespace: quicfuscate
  labels:
    app.kubernetes.io/name: quicfuscate
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
