# ==============================================================================
# QuicFuscate Kubernetes Secret Template
# ==============================================================================
# Template for sensitive deployment values. Apply with real base64-encoded
# values. NEVER commit real secrets to source control — this file contains
# placeholder values only.
#
# Required keys:
#   admin_user         - admin web dashboard username
#   admin_password     - admin web dashboard password (Argon2id-hashed on first
#                        start; plaintext is accepted and auto-hashed)
#   qkey_enc_key       - 64-hex-char (32-byte) QKey encryption key for
#                        encrypting the QKey registry at rest. Generate with:
#                        openssl rand -hex 32
#
# TLS keys (quicfuscate-tls):
#   tls.crt            - server TLS certificate (PEM)
#   tls.key            - server TLS private key (PEM)
#
# Generate base64 values for kubectl apply:
#   echo -n "admin" | base64
#   echo -n "your-password" | base64
#   openssl rand -hex 32 | tr -d '\n' | base64
#
# Or apply via kubectl create secret directly:
#   kubectl create secret generic quicfuscate-secret \
#     -n quicfuscate \
#     --from-literal=admin_user=admin \
#     --from-literal=admin_password='your-strong-password' \
#     --from-literal=qkey_enc_key=$(openssl rand -hex 32)
#
#   kubectl create secret tls quicfuscate-tls \
#     -n quicfuscate \
#     --cert=path/to/server.crt \
#     --key=path/to/server.key
# ==============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: quicfuscate
  labels:
    app.kubernetes.io/name: quicfuscate
---
apiVersion: v1
kind: Secret
metadata:
  name: quicfuscate-secret
  namespace: quicfuscate
  labels:
    app.kubernetes.io/name: quicfuscate
type: Opaque
stringData:
  # Admin web dashboard credentials. REPLACE these placeholders before applying.
  admin_user: "admin"
  admin_password: "CHANGE-ME-please-use-a-strong-password"
  # QKey at-rest encryption key (64 hex chars = 32 bytes). Generate with:
  #   openssl rand -hex 32
  # Leave empty to disable at-rest encryption (plaintext QKey registry).
  qkey_enc_key: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: quicfuscate-tls
  namespace: quicfuscate
  labels:
    app.kubernetes.io/name: quicfuscate
type: kubernetes.io/tls
stringData:
  # REPLACE with your real TLS certificate and private key (PEM format).
  # These are mounted at /etc/quicfuscate/certs/tls.crt and tls.key.
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE-WITH-YOUR-SERVER-CERTIFICATE-PEM
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE-WITH-YOUR-SERVER-PRIVATE-KEY-PEM
    -----END PRIVATE KEY-----
