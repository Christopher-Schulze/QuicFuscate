# ==============================================================================
# QuicFuscate Kubernetes Service
# ==============================================================================
# Exposes the QuicFuscate QUIC server on UDP 443 via a LoadBalancer. The admin
# HTTP dashboard (TCP 8080) is exposed via a separate ClusterIP-only service
# for internal access only — it should not be publicly reachable.
#
# Apply after deployment.yaml.
# ==============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: quicfuscate
  namespace: quicfuscate
  labels:
    app.kubernetes.io/name: quicfuscate
    app.kubernetes.io/component: server
  annotations:
    # Cloud provider metallb / external-dns annotations can be added here.
    # For on-prem clusters without a LoadBalancer controller, consider
    # replacing type with NodePort or using metallb.
    service.beta.kubernetes.io/load-balancer-source-ranges: "0.0.0.0/0"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: quicfuscate
    app.kubernetes.io/component: server
  ports:
    - name: quic
      port: 443
      targetPort: quic
      protocol: UDP
  # QUIC requires a stable source IP for connection migration; some cloud
  # LoadBalancers support this via externalTrafficPolicy: Local.
  externalTrafficPolicy: Local
---
# Admin HTTP dashboard - ClusterIP only (internal access).
# Expose externally only behind an authenticated reverse proxy / ingress.
apiVersion: v1
kind: Service
metadata:
  name: quicfuscate-admin
  namespace: quicfuscate
  labels:
    app.kubernetes.io/name: quicfuscate
    app.kubernetes.io/component: admin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: quicfuscate
    app.kubernetes.io/component: server
  ports:
    - name: admin
      port: 8080
      targetPort: admin
      protocol: TCP
