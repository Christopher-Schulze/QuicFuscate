# ==============================================================================
# QuicFuscate Docker Compose
# ==============================================================================
# Quick-start orchestration for the QuicFuscate server and an optional client.
#
# The server requires host networking because it creates a TUN interface
# (quicfuse0) and installs iptables rules directly on the host network stack.
# It MUST run with:
#   - /dev/net/tun device passthrough
#   - NET_ADMIN capability (TUN + iptables)
#   - NET_BIND_SERVICE capability (UDP 443 privileged port)
#
# Usage:
#   # Server only (default):
#   docker compose up -d
#
#   # Server + optional client (client connects to the server over the bridge):
#   docker compose --profile client up -d
#
# Required environment (set in .env or export before running):
#   QUICFUSCATE_ADMIN_PASSWORD   - admin web dashboard password
#   QUICFUSCATE_QKEY_ENC_KEY      - 64-hex-char (32-byte) QKey encryption key
# Optional:
#   QUICFUSCATE_ADMIN_USER        - admin web username (default: admin)
#   QUICFUSCATE_LISTEN_PORT       - QUIC listen port (default: 443)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # QuicFuscate Server
  # ----------------------------------------------------------------------------
  # host network mode is required: the server creates a TUN interface and
  # manages routing/iptables on the host. Bridge networking would isolate the
  # TUN device and break VPN forwarding.
  server:
    image: quicfuscate:0.4.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quicfuscate-server
    network_mode: host
    restart: unless-stopped
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
      - NET_RAW
    env_file:
      - path: .env
        required: false
    environment:
      QUICFUSCATE_ADMIN_USER: ${QUICFUSCATE_ADMIN_USER:-admin}
      QUICFUSCATE_ADMIN_PASSWORD: ${QUICFUSCATE_ADMIN_PASSWORD:?QUICFUSCATE_ADMIN_PASSWORD is required}
      QUICFUSCATE_QKEY_ENC_KEY: ${QUICFUSCATE_QKEY_ENC_KEY:-}
      QUICFUSCATE_LISTEN_PORT: ${QUICFUSCATE_LISTEN_PORT:-443}
      QUICFUSCATE_TUN_NAME: ${QUICFUSCATE_TUN_NAME:-quicfuse0}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      # Server configuration (read-only). Mount your server TOML here.
      - ./config/server-linux.default.toml:/etc/quicfuscate/quicfuscate.toml:ro
      # TLS certificate and private key (read-only).
      - ./certs:/etc/quicfuscate/certs:ro
      # Persistent QKey registry and admin auth state (read-write).
      - quicfuscate-state:/var/lib/quicfuscate
      # Log output.
      - quicfuscate-logs:/var/log/quicfuscate
    ports:
      # With host networking these are informational; the server binds directly
      # to the host's 0.0.0.0:443 (UDP) and 0.0.0.0:8080 (TCP admin).
      - "443:443/udp"
      - "8080:8080/tcp"
    healthcheck:
      # GET / serves the web-admin index.html (200, no auth). A dedicated
      # unauthenticated /api/health endpoint does not yet exist.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ----------------------------------------------------------------------------
  # QuicFuscate Client (optional - enable with --profile client)
  # ----------------------------------------------------------------------------
  # The client runs in bridge networking mode and only needs NET_ADMIN when
  # TUN bridging is enabled (--tun). Without --tun it operates as a userspace
  # UDP relay and needs no special privileges.
  client:
    image: quicfuscate:0.4.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quicfuscate-client
    profiles: ["client"]
    restart: unless-stopped
    network_mode: bridge
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      QUICFUSCATE_REMOTE: ${QUICFUSCATE_REMOTE:?QUICFUSCATE_REMOTE (server host:port) is required for client}
      QUICFUSCATE_QKEY: ${QUICFUSCATE_QKEY:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./config/quicfuscate.toml:/etc/quicfuscate/quicfuscate.toml:ro
      - quicfuscate-client-state:/var/lib/quicfuscate
    # Override the entrypoint to run in client mode.
    command: >
      sh -c "exec quicfuscate client
      --remote $${QUICFUSCATE_REMOTE}
      --config /etc/quicfuscate/quicfuscate.toml
      $${QUICFUSCATE_QKEY:+--qkey $$QUICFUSCATE_QKEY}"

volumes:
  quicfuscate-state:
  quicfuscate-logs:
  quicfuscate-client-state:
